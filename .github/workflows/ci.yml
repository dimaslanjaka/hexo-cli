name: CI

on:
  push:
    branches:
      - "monorepo"
  pull_request:

env:
  default_node_version: 24
  github_token: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN || secrets.github_token }}

jobs:
  test:
    name: Test
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["24", "26"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Node.js ${{ matrix.node-version }} and Cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            dist
            tmp
            yarn.lock
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
      - name: Install Dependencies
        run: touch yarn.lock && yarn install
      - name: Test
        run: yarn run test-all

  coverage:
    name: Coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Node.js ${{env.default_node_version}} and Cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{env.default_node_version}}
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            dist
            tmp
            yarn.lock
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
      - name: Install Dependencies
        run: touch yarn.lock && yarn install
      - name: Coverage
        run: yarn run test-cov
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ env.github_token }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Node.js ${{env.default_node_version}} and Cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{env.default_node_version}}
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            dist
            tmp
            yarn.lock
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
      - name: Install Dependencies
        run: touch yarn.lock && yarn install
      - name: Clean
        run: yarn run clean
      - name: Build
        run: yarn run build

  lint:
    if: false
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Node.js ${{env.default_node_version}} and Cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{env.default_node_version}}
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            dist
            tmp
            yarn.lock
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}

      - name: Install Dependencies
        run: touch yarn.lock && yarn install
      - name: Lint
        run: yarn run eslint

  pack:
    name: Pack
    needs: [build, test, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Node.js ${{env.default_node_version}} and Cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{env.default_node_version}}
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            dist
            tmp
            yarn.lock
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
      - name: Install Dependencies
        run: touch yarn.lock && yarn install
      - name: Pack
        run: yarn run pack

      - name: 🕵️‍♂️ Check for changes in build artifacts
        id: changes
        shell: bash
        run: |
          PATHS=( ':(glob)release*/*.tgz' )
          TRACKED=$(git diff --name-only HEAD -- "${PATHS[@]}" || true)
          UNTRACKED=$(git ls-files --others --exclude-standard -- "${PATHS[@]}" || true)
          FILES=$(printf '%s\n%s\n' "$TRACKED" "$UNTRACKED" | sed '/^$/d' | sort -u)
          if [ -n "$FILES" ]; then
            echo "Found artifact changes"
          else
            echo "No artifact changes detected"
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            echo "files_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "files_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 👤 Configure git user/email
        if: steps.changes.outputs.files_changed == 'true'
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --global url.\"https://x-access-token:${{ env.github_token }}@github.com/\".insteadOf \"https://github.com/\"

      - name: ➕ Add build files to git
        if: steps.changes.outputs.files_changed == 'true'
        continue-on-error: true
        run: git add -- release*/ || true

      - name: 🚀 Push changes to remote
        if: steps.changes.outputs.files_changed == 'true'
        shell: bash
        run: |
          if [ $(git diff --cached --name-only | wc -l) -gt "0" ]; then
            echo "Staged files and their sizes:"
            for file in $(git diff --cached --name-only); do
              if [ -f "$file" ]; then
                size_bytes=$(stat -c%s "$file")
                size_mb=$((size_bytes / 1024 / 1024))
                echo "${size_mb}MB $file"
                if [ "$size_mb" -gt 30 ]; then
                  echo "Error: $file exceeds 30MB ($size_mb MB). Aborting push."
                  tar -tzvf "$file"
                  exit 1
                fi
              fi
            done
            git commit -m "chore: update build from ${{ github.event.head_commit.url || 'workflow' }}" \
                       -m "commit hash: ${{ github.sha }}" \
                       -m "runner: ${{ github.run_id }}"
            git push
          fi