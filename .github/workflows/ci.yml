name: CI

on:
  push:
    branches:
      - "master"
      - "monorepo"
  pull_request:

env:
  default_node_version: 20

jobs:
  test:
    name: Test
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["20", "22", "24"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ${{ matrix.node-version }} and Cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            dist
            tmp
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package.json') }}
      - name: Install Dependencies
        run: npm install
      - name: Test
        run: npm run test

  coverage:
    name: Coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ${{env.default_node_version}} and Cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{env.default_node_version}}
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            dist
            tmp
          key: ${{ runner.os }}-node-${{env.default_node_version}}-${{ hashFiles('**/package.json') }}
      - name: Install Dependencies
        run: npm install
      - name: Coverage
        run: npm run test-cov
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ${{env.default_node_version}} and Cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{env.default_node_version}}
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            dist
            tmp
          key: ${{ runner.os }}-node-${{env.default_node_version}}-build-${{ hashFiles('**/package.json') }}

      - name: Install Dependencies
        run: npm install
      - name: Build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ${{env.default_node_version}} and Cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{env.default_node_version}}
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            dist
            tmp
          key: ${{ runner.os }}-node-${{env.default_node_version}}-lint-${{ hashFiles('**/package.json') }}

      - name: Install Dependencies
        run: npm install
      - name: Lint
        run: npm run eslint
